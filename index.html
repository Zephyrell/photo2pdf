<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo2pdf</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo2pdf">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg: #0b1020; --card: #161d31; --line: #253049;
  --ink: #e7ecf5; --mut: #8b97ad; --accent: #3b82f6; --danger: #ef4444;
}
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding: max(14px, env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
main { max-width: 620px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin: 6px 0 2px; letter-spacing: -0.02em; }
.hint { color: var(--mut); font-size: .82rem; margin: 0 0 16px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.quit { border: 0; background: none; color: var(--mut); font: .8rem system-ui; padding: 8px 0; cursor: pointer; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.grid:empty { display: none; }
.page {
  position: relative; margin: 0; border-radius: 12px; overflow: hidden;
  background: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.06);
  cursor: pointer; animation: pop .18s ease-out;
}
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.page canvas { display: block; width: 100%; height: auto; }
.ph { aspect-ratio: 3/4; background: repeating-linear-gradient(45deg,#e5e7eb 0 8px,#f3f4f6 8px 16px); }
.num {
  position: absolute; top: 6px; left: 6px; font-size: .68rem; font-weight: 700;
  background: rgba(11,16,32,.8); color: #fff; padding: 1px 8px; border-radius: 99px;
}
.del {
  position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; padding: 0;
  border: 0; border-radius: 50%; background: rgba(239,68,68,.92); color: #fff;
  font: 600 18px/28px system-ui; cursor: pointer;
}
.mv {
  position: absolute; bottom: 6px; display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%;
  background: rgba(11,16,32,.8); color: #fff; font: 600 18px/1 system-ui; cursor: pointer;
}
.mv.prev { left: 6px; }
.mv.next { right: 6px; }
.mv:disabled { opacity: .22; cursor: default; }

.actions { display: grid; gap: 9px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px; border: 0; border-radius: 13px;
  font: 600 1rem system-ui; background: var(--card); color: var(--ink);
  cursor: pointer; text-decoration: none;
}
.btn.primary { background: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--mut); font-size: .86rem; }
.field input { width: 18px; height: 18px; accent-color: var(--accent); }
#status { min-height: 1.3em; margin: 12px 0 0; color: var(--mut); font-size: .83rem; text-align: center; }
.result { margin-top: 12px; }
.result p { margin: 0 0 9px; font-size: .86rem; color: var(--ink); text-align: center; }
.result p b { color: #7dd3a7; }

/* éditeur */
.editor { position: fixed; inset: 0; background: #05070d; display: flex; flex-direction: column; z-index: 10; }
.editor[hidden] { display: none; }
.editor-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px; font-size: .8rem; color: var(--mut);
}
.link { border: 0; background: none; color: var(--ink); font: 600 .95rem system-ui; padding: 10px 2px; cursor: pointer; }
.link.accent { color: var(--accent); }
.stage { flex: 1; position: relative; overflow: hidden; }
.stage img { width: 100%; height: 100%; object-fit: contain; display: block; }
.stage canvas { position: absolute; inset: 0; touch-action: none; }
.editor-tip { text-align: center; font-size: .76rem; color: var(--mut); padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); }

.hist { margin-top: 10px; background: var(--card); border-radius: 13px; overflow: hidden; }
.hist:empty { display: none; }
.hist > p { margin: 0; padding: 14px; color: var(--mut); font-size: .86rem; text-align: center; }
.hrow { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hrow b { font-weight: 600; }
.hopen {
  flex: 1; display: flex; justify-content: space-between; gap: 10px; text-align: left;
  padding: 13px 14px; border: 0; background: none; color: inherit;
  font: .88rem system-ui; cursor: pointer;
}
.hopen span { color: var(--mut); }
.hdel { border: 0; background: none; color: var(--danger); font: 600 18px/1 system-ui; padding: 14px; cursor: pointer; }

#pick { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Photo2pdf</h1>
      <p class="hint">Facture → PDF sous 2 Mo. Tout est traité sur le téléphone.</p>
    </div>
    <form method="post" action="/logout"><button class="quit">Quitter</button></form>
  </header>

  <div id="grid" class="grid"></div>

  <div class="actions">
    <button id="addBtn" class="btn">Ajouter une photo</button>
    <button id="makeBtn" class="btn primary" disabled>Créer le PDF</button>
    <label class="field"><input type="checkbox" id="colorChk"> Conserver les couleurs</label>
  </div>

  <button id="histBtn" class="btn" style="margin-top:9px">Historique serveur</button>
  <div id="hist" class="hist" hidden></div>

  <div id="result" class="result" hidden>
    <p id="resultInfo"></p>
    <div class="actions">
      <button id="shareBtn" class="btn primary">Partager</button>
      <button id="saveBtn" class="btn">Envoyer sur le serveur</button>
    </div>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<input id="pick" type="file" accept="image/*" multiple>

<div id="editor" class="editor" hidden>
  <div class="editor-top">
    <button id="edCancel" class="link">Annuler</button>
    <span>Recadrage</span>
    <button id="edOk" class="link accent">Valider</button>
  </div>
  <div class="stage" id="stage">
    <img id="edImg" alt="Photo à recadrer">
    <canvas id="edCanvas"></canvas>
  </div>
  <p class="editor-tip">Fais glisser les 4 coins sur les angles de la feuille.</p>
</div>

<script src="core.js?v=20261101"></script>
<script src="pdf.js?v=20261101"></script>
<script src="app.js?v=20261101"></script>
</body>
</html>
