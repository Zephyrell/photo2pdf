<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — Photo2pdf</title>
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="noindex">
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; --bg: #0b1020; --card: #161d31; --line: #253049;
        --ink: #e7ecf5; --mut: #8b97ad; --accent: #3b82f6; --danger: #ef4444; }
html, body { margin: 0; min-height: 100%; }
body {
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding: max(14px, env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
}
form { width: 100%; max-width: 340px; background: var(--card); border-radius: 16px; padding: 22px; }
h1 { font-size: 1.2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
p.sub { color: var(--mut); font-size: .82rem; margin: 0 0 18px; }
#err { background: rgba(239,68,68,.12); color: #fca5a5; border-radius: 9px;
       padding: 9px 11px; margin: 0 0 14px; font-size: .84rem; }
label { display: block; color: var(--mut); font-size: .8rem; margin-bottom: 12px; }
input {
  display: block; width: 100%; margin-top: 6px; padding: 12px 13px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--bg);
  color: var(--ink); font: 1rem system-ui; -webkit-appearance: none;
}
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
button {
  width: 100%; margin-top: 6px; padding: 14px; border: 0; border-radius: 12px;
  background: var(--accent); color: #fff; font: 600 1rem system-ui; cursor: pointer;
}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Photo2pdf</h1>
  <p class="sub">Accès réservé.</p>
  <p id="err" hidden>Identifiant ou mot de passe incorrect.</p>
  <label>Utilisateur
    <input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" required>
  </label>
  <label>Mot de passe
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Entrer</button>
</form>
<script>
if (new URLSearchParams(location.search).has("e")) document.getElementById("err").hidden = false;
</script>
</body>
</html>
